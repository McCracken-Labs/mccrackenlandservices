# Scissortail collector - Cloudflare Worker config.
# Fill in the two placeholders after you create the D1 database (see README).

name = "scissortail"
main = "worker.js"
compatibility_date = "2025-01-01"

# 1) Create the database:   wrangler d1 create scissortail
#    then paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "scissortail"
database_id = "f48b38dd-236e-4047-9fce-176ecfee6c8f"

# Secrets are NOT stored here. Set them once from the terminal:
#   wrangler secret put SALT           (any long random string)
#   wrangler secret put DASH_TOKEN     (the read password for your dashboard)
#   wrangler secret put RESEND_API_KEY (the re_... key from resend.com, for reports)

# ---- Scissortail Reports ----
# Daily cron. It checks each registered site and sends the ones that are due:
# daily every day, weekly on Mondays, monthly on the 1st (all times UTC).
# 13:00 UTC is ~8am Central.
[triggers]
crons = ["0 13 * * *"]

# Plain (non-secret) settings for the report emails:
[vars]
MAIL_FROM = "Scissortail Reports <reports@mccrackenlabs.com>"
REPORT_BASE = "https://scissortail.mccrackenlabs.workers.dev"
# Replies to a report land here (Resend receiving is off on the sending domain):
REPLY_TO = "mccrackenlabs@proton.me"
